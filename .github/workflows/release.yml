# Tests every push and pull request. A tag vX.Y.Z also signs that version on AMO (unlisted) and
# publishes it as a GitHub release, which Firefox then auto-updates from.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   AMO_JWT_ISSUER, AMO_JWT_SECRET   from https://addons.mozilla.org/developers/addon/api/key/
# The repository has to be public for Firefox to fetch updates.json and the .xpi.
name: Test and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gjs, pass and gpg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gjs pass gnupg
      - name: Matching and ranking
        run: gjs -m tests/match_test.js
      - name: Native host (throwaway key and store)
        run: tests/host_test.sh
      - name: End to end in headless Firefox
        run: python3 tests/e2e_firefox.py
        timeout-minutes: 5
      - name: Toolbar icon on light, dark, custom and private-window themes
        run: |
          python3 tests/icon_check.py toolbar-shots
          python3 tests/icon_check.py toolbar-shots --dark
        timeout-minutes: 5
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: toolbar-shots
          path: toolbar-shots
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency: amo-signing
    steps:
      - uses: actions/checkout@v7
      - name: Version from tag
        id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "$version" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$' || { echo "::error::Tag $tag is not vX.Y.Z"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Sign on addons.mozilla.org (unlisted)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          python3 tools/sign.py --version "$VERSION" \
            --update-url "https://github.com/$REPO/releases/latest/download/updates.json" \
            --update-link "https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/pass_fill-$VERSION.xpi"
      - name: Bundle the native host
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: tar czf "dist/pass-fill-host-$VERSION.tar.gz" host install.sh README.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "pass fill $VERSION" --generate-notes \
            --notes "Install \`pass_fill-$VERSION.xpi\` in Firefox, and the native host with \`install.sh\` from \`pass-fill-host-$VERSION.tar.gz\` (or a checkout)."
